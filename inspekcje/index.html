<script>/* wejście z karty PPM (#ppm=…) prosto do formularza: ramka formularza od pierwszej klatki, treść wpisuje start niżej – bez cudzego ekranu i bez pustej strony (bramka B1).
   Karta z listą urządzeń (np. izolatory, t.open bez t.dev) otwiera listę – tu nic nie odsłaniam (przegląd Codex #129). */
  (function () { try { var h = new URLSearchParams(location.hash.slice(1)), P = window.OEST_PPM, t = !h.get("rec") && P && P.byId(h.get("ppm") || "");
    if (t && !(t.open && !t.dev)) { document.documentElement.classList.add("wy-wczytanie"); document.getElementById("v-form").hidden = false; } } catch (e) {} })();</script>
