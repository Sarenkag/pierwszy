<style>
/* Powłoka apki: start (logowanie) → menu główne → moduły. Kolory i krój jak w inspekcjach. */
:root {
  --bg: #eef1f2;
  --panel: #ffffff;
  --ink: #17242c;
  --muted: #5b6a73;
  --line: #d3dade;
  --accent: #e8a317;
  --accent-ink: #1a1405;
  --steel: #2c4656;
  --ok: #2f7d4f;
  --bad: #b3322b;
  --field: #f6f8f9;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171c; --panel: #172229; --ink: #e4ecef; --muted: #93a4ad; --line: #2b3a43;
    --accent: #f0b23a; --steel: #9cc0d4; --ok: #5cc28a; --bad: #ef7a72; --field: #1d2a32; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  /* apka: zawsze ciemna, grafit + zielony akcent (wybór Grzegorza 30/10) */
  --bg: #111418; --panel: #1a1e23; --ink: #e6e9ec; --muted: #8b949e; --line: #2a3038;
  --accent: #3ecf8e; --accent-ink: #05170e; --steel: #9fb3c2; --ok: #3fb27f; --bad: #e5534b; --warn: #e3b341; --field: #20252b; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap {
  max-width: 560px; margin: 0 auto; min-height: 100%; /* w ramie Ionic (moduly/szkielet): odstęp od paska telefonu daje rama */
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
[hidden] { display: none !important; }
.view { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.top .t { flex: 1; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.05; margin: 0; text-transform: uppercase; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 0.92rem; }
.back { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 1.4rem; cursor: pointer; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.label { font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 0.9rem; margin: 0; }
.err { color: var(--bad); font-size: 0.92rem; margin: 0; }

/* Start */
#v-start { min-height: calc(100vh - 80px); justify-content: center; text-align: center; gap: 22px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.appname { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; letter-spacing: 0.04em; line-height: 1; margin: 0; }
.logo {
  width: 112px; height: 112px; border-radius: 24px; background: var(--steel); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: 0.04em;
  border-bottom: 6px solid var(--accent);
}
.site { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.auth { display: flex; flex-direction: column; gap: 10px; text-align: left; }

/* Przyciski */
.btn {
  min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: inherit; font-weight: 600; padding: 0 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn svg { width: 22px; height: 22px; }
.linkish { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 6px; }

/* Menu główne i Settings */
.tiles { display: flex; flex-direction: column; gap: 10px; }
.tile {
  display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left;
  width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer;
}
.tile svg { width: 40px; height: 40px; stroke: var(--steel); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tile b { display: block; font-family: var(--font-display); font-size: 1.35rem; text-transform: uppercase; line-height: 1.1; }
.tile .arrow { font-size: 1.4rem; color: var(--muted); }
.who { display: flex; align-items: center; gap: 12px; }
.who img { width: 40px; height: 40px; border-radius: 50%; }

/* Formularz */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 0.92rem; color: var(--muted); }
input[type=text], input[type=email], input[type=date], select {
  min-height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: inherit; padding: 0 12px; width: 100%;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 22px; height: 22px; }
.saved { color: var(--ok); font-weight: 600; }

/* Lista PPM: pasek dni, filtry grup, płaskie wiersze z kreską koloru grupy */
.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; width: 48px; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; text-align: center; cursor: pointer; }
.day small { display: block; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; }
.day b { display: block; font-size: 1.1rem; }
.day i { display: block; font-style: normal; font-size: 0.78rem; color: var(--muted); min-height: 1.1em; }
.day i.n { color: var(--accent); font-weight: 700; }
.day.on { border-color: var(--accent); }
.day.today small { color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
/* B2 (Grzegorz 07/11/2026, wariant A): filtry Inspekcji w jednym rzędzie przewijanym w bok, jak pasek dni – PL/EN nie zmienia wysokości, lista nie skacze */
#ppmChips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
#ppmChips::-webkit-scrollbar { display: none; }
#ppmChips .chip { flex: none; white-space: nowrap; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.ppm { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 12px 10px 0; border: 0; border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; text-align: left; cursor: pointer; overflow: hidden; }
.prow .bar { align-self: stretch; }
.prow .nm { font-weight: 600; line-height: 1.25; }
.prow .dt { color: var(--muted); font-size: 0.85rem; }
.st { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); opacity: .5; position: relative; }
.st.g { background: var(--ok); opacity: 1; }
.st.r, .st.x { background: var(--bad); opacity: 1; }
.st.x::after { content: "!"; position: absolute; right: -10px; top: -6px; color: var(--bad); font-weight: 800; }
</style>

    <section class="view" id="v-powertrace" hidden></section>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) { try { var v = localStorage.getItem("oest." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem("oest." + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  var CONF = window.OEST_CONFIG || {};
  var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  var Social = native && window.Capacitor.Plugins ? window.Capacitor.Plugins.SocialLogin : null;

  // ---------- widoki ----------
  // Każdy ekran to wpis w historii (#nazwa), więc systemowy „wstecz” na Androidzie cofa o jeden ekran
  var renderedRoute = "";
  function render(v) {
    // ekran przeniesiony na Ionic + Vue rysuje rama (moduly/szkielet) – stary kod tylko się chowa
    if (!account() && v !== "start") { window.OESTEkrany.go("start"); return; } // bez konta tylko ekran Start
    if (window.OESTEkrany.jestVue(v)) { document.querySelectorAll(".view").forEach(function (s) { s.hidden = true; }); renderedRoute = v; return; }
    var settingsRoute = v === "settings" || v === "profile" || v === "appset" || v.indexOf("settings/") === 0 ? v : null;
    var handoverRoute = v === "handover" || v.indexOf("handover/") === 0 ? v : null;
    var keysRoute = v === "keys" || v.indexOf("keys/") === 0 ? v : null;
    var powerRoute = v === "powertrace" || v.indexOf("powertrace/") === 0 ? v : null;
    if (powerRoute) v = "powertrace";
    if (keysRoute) v = "keys";
    if (settingsRoute) v = "settings";
    if (handoverRoute) v = "handover";
    if (!account()) v = "start";
    else if (!$("v-" + v)) { window.OESTEkrany.go("home"); return; } // nieznany adres → ekran główny (na Ionic + Vue)
    document.querySelectorAll(".view").forEach(function (s) { s.hidden = s.id !== "v-" + v; });
    if (v === "handover") window.OESTHandover.open(handoverRoute);
    if (v === "keys") window.OESTKeys.open(keysRoute);
    if (v === "powertrace") window.OESTPowerTrace.open(powerRoute);
    if (v === "zdjecia" && window.OESTZdjeciaUI) window.OESTZdjeciaUI.open();
    if (v === "appset") renderAccount();
    renderedRoute = powerRoute && v === "powertrace" ? powerRoute : keysRoute && v === "keys" ? keysRoute : handoverRoute && v === "handover" ? handoverRoute : settingsRoute && v === "settings" ? settingsRoute : v;
    window.OESTEkrany.naGore();
  }
  // Nawigacja i Wstecz: JEDEN moduł – moduly/szkielet (Ionic + Vue, Grzegorz 21/11/2026). Tu tylko: co narysować dla trasy
  // i kto pilnuje niezapisanych zmian przy wyjściu w górę (canLeave ekranu). Historia przeglądarki nie jest stanem.
  function show(v) { window.OESTEkrany.go(v); }
  [window.OESTHandover, window.OESTKeys, window.OESTPowerTrace, window.OESTReactiveUI, window.OESTZdjeciaUI]
    .forEach(function (m) { if (m && m.setNavigate) m.setNavigate(show); });
  [["settings", window.OESTSettingsUI], ["profile", window.OESTSettingsUI], ["appset", window.OESTSettingsUI], ["questions", window.OESTQuestionsUI],
   ["powertrace", window.OESTPowerTrace], ["keys", window.OESTKeys], ["handover", window.OESTHandover]]
    .forEach(function (x) { if (x[1] && x[1].canLeave) window.OESTEkrany.straz(x[0], function () { return x[1].canLeave(); }); });
  // Reactive (Vue): podgląd i kreator cofają się w sobie, niezapisany szkic zostaje; inaczej rodzic (węzeł drzewka, karta zlecenia)
  if (window.OESTReactiveUI) window.OESTEkrany.straz("reactive", function () { return window.OESTReactiveUI.wstecz(); });
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-nav][data-title]"); if (b && $("soonTitle")) $("soonTitle").textContent = b.dataset.title; }, true);
  // język interfejsu (Grzegorz 03/11): PL domyślnie, EN z Ustawień; elementy z data-en podmieniają tylko tekst
  function applyLang() { if (window.OESTBledy) OESTBledy.applyDom(document); } // stały HTML: data-en / data-en-aria-label …
  window.addEventListener("oest:lang", function () { applyLang(); });
  applyLang();
  document.querySelectorAll("[data-open]").forEach(function (b) {
    b.addEventListener("click", function () { window.OESTEkrany.otworzStrone(b.dataset.open + "/index.html"); });
  });

  // ---------- konto (logowanie raz; potem apka otwiera się bez sieci) ----------
  function account() { return window.OESTKonto.get(); } // moduly/konto
  function setAccount(a) { window.OESTKonto.set(a); }

  $("logoutBtn").addEventListener("click", function () {
    var a = account();
    if (Social && a && a.provider === "google") Social.logout({ provider: "google" }).catch(function () {});
    window.OESTGoogle.disconnect();
    window.OESTKonto.clear();
    window.OESTEkrany.go("start");
  });
  function renderAccount() {
    var a = account() || {};
    $("accName").textContent = a.name || (a.provider === "local" ? "Bez logowania" : "—");
    $("accMail").textContent = a.email || "";
    $("accPic").hidden = !a.pic; if (a.pic) $("accPic").src = a.pic;
  }

  // Shared versioned profile: consumed by Settings and other modules.
  function profile() { return window.OESTSettings.get().profile; }
  function seedProfile() {
    window.OESTSettings.get();
    window.OESTSettings.syncLegacy();
    // język z Mój profil przy starcie apki (Grzegorz 08/11). Raz na uruchomienie: przejście do inspekcji i z powrotem
    // przeładowuje tę stronę, ale sessionStorage zostaje do zamknięcia apki, więc przełączony PL/EN nie wraca w trakcie pracy.
    var started = false; try { started = sessionStorage.getItem("oest.start") === "1"; sessionStorage.setItem("oest.start", "1"); } catch (e) {}
    if (!started) window.OESTSettings.startLanguage();
    window.OESTSettingsUI.applyTheme();
  }

  // ---------- start ----------
  window.OESTStart.init({ conf: CONF, native: native, social: Social, seed: seedProfile, wejdz: function () { window.OESTEkrany.go("home"); } });
  if (account()) {
    try { seedProfile(); } catch (e) { window.OESTStart.blad(window.OESTT("Ustawienia: ", "Settings: ") + (window.OESTBledy ? OESTBledy.text(e) : e.message)); }
  }
  // start: ekran z adresu (powrót z inspekcji, odzyskana z Raportów…); bez konta – logowanie. Wstecz = rodzic z mapy ekranów.
  var start = (location.hash || "").slice(1);
  if (!account()) start = "start"; else if (!start || start === "start") start = "home";
  window.OESTEkrany.start({ naEkran: render, trasa: start });
})();
</script>
<script>if (window.OESTSender) OESTSender.init({ ustawienia: function () { return OESTSettings.get(); } }); // pasek wysyłki raportów na dole, wysyła kolejkę z inspekcji w tle</script>
</body>
</html>
