# Buduje apkę OEST na Androida (folder app/ + inspekcje/).
# Każda budowa daje plik APK w zakładce Actions (Artifacts). Po scaleniu do main APK trafia też do Releases,
# skąd można go pobrać prosto na telefon.
# Podpis: sekrety ANDROID_KEYSTORE_B64 i ANDROID_KEYSTORE_PASSWORD (instrukcja: app/README.md).
# Bez nich powstaje wersja testowa z losowym podpisem (logowanie Google w niej nie zadziała).
# Wydanie (wariant A, Grzegorz 07/11/2026): APK trafia do Releases TYLKO, gdy w tym samym uruchomieniu i na tym samym SHA
# przeszedł cały Quality Gate (G0–G2, .github/workflows/quality-gate.yml). Prawo zapisu (contents: write) ma tylko job wydania.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", "inspekcje/**", "moduly/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "inspekcje/**", "moduly/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Quality Gate przed wydaniem: tylko dla push na main (jedyna droga do Releases). PR mają osobny workflow Quality Gate.
  gate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read

  apk:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      sha: ${{ steps.sha.outputs.sha }}
    defaults:
      run:
        working-directory: app
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pełna historia: lista zmian w klocku „O aplikacji” (app/scripts/wersja.js)

      - name: SHA budowanego kodu
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Strona apki
        run: |
          npm ci
          npm run sync

      # ZASADA Grzegorza (04/11/2026): każdy raport w dwóch identycznych wersjach, Word i PDF. Bez tego APK się nie zbuduje.
      # Na PR te same testy (npm test = G0, raport-ui-check i raport-rozmiar-ui-check = G2) wykonuje wymagany check
      # „Quality Gate” (quality-gate.yml, każdy PR bez filtra ścieżek), a bez niego PR nie wejdzie do main (ruleset).
      # Dlatego na PR ich tu nie powtarzamy (krok 1, zgoda Grzegorza 07/11/2026). Push na main i ręczne uruchomienie
      # wykonują je jak dotąd, a wydanie i tak czeka na pełny Quality Gate na tym samym SHA (job gate).
      - name: Testy (każda inspekcja daje Word i PDF)
        if: github.event_name != 'pull_request'
        run: |
          npm test
          npm i --no-save playwright-core@1.48.2
          OEST_PLAYWRIGHT_PATH=playwright-core OEST_BROWSER_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" node tests/raport-ui-check.cjs
          # ZASADA Grzegorza (05/11/2026): każdy plik raportu poniżej 1 MB – prawdziwy Flushing TB z 20 różnymi zdjęciami
          OEST_PLAYWRIGHT_PATH=playwright-core OEST_BROWSER_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)" node tests/raport-rozmiar-ui-check.cjs

      - name: Klucz podpisu
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/oest.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/oest.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Brak sekretu ANDROID_KEYSTORE_B64 — buduję wersję testową."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Budowa
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          # Maven Central czasem chwilowo nie oddaje plików: jedna ponowna próba po przerwie
          gw() { ./gradlew --no-daemon "$@" || { sleep 30; ./gradlew --no-daemon "$@"; }; }
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            gw assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/OEST-${APP_VERSION_CODE}.apk"
          else
            gw assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/OEST-${APP_VERSION_CODE}-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: OEST-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/OEST-*.apk

  release:
    name: Wydanie (Releases) – po zielonym Quality Gate
    needs: [gate, apk]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.apk.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Quality Gate i APK z tego samego SHA
        env:
          GATE: ${{ needs.gate.result }}
          APK_SHA: ${{ needs.apk.outputs.sha }}
        run: |
          echo "Quality Gate: $GATE · APK z $APK_SHA · uruchomienie dla ${GITHUB_SHA}"
          if [ "$GATE" != "success" ]; then echo "::error title=Wydanie wstrzymane::Quality Gate = $GATE. APK nie trafia do Releases."; exit 1; fi
          if [ "$APK_SHA" != "$GITHUB_SHA" ]; then echo "::error title=Wydanie wstrzymane::APK zbudowany z $APK_SHA, a bramka sprawdzała $GITHUB_SHA."; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          name: OEST-apk-${{ github.run_number }}
          path: apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: OEST ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apk/OEST-*.apk
